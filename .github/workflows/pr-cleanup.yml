name: PR-Close Cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Closed PR Context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
      commit_sha: ${{ steps.context.outputs.commit_sha }}
      disposition: ${{ steps.context.outputs.disposition }}
    steps:
      - name: Checkout trusted base-main control code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/main
          path: control
          persist-credentials: false
      - name: Resolve current PR through API
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await require('./control/.github/scripts/preview-context.cjs').resolve({ github, context, core });
            } catch { core.setFailed('Close context resolution failed: validate same-repository PR and API availability.'); }

  cleanup:
    name: Delete Owned Closed-PR Preview
    needs: resolve
    if: needs.resolve.outputs.disposition == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    # Shared mutation serialization, not a durable ordered lifecycle queue.
    concurrency:
      group: cdd-preview-pr-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
      POLICY_TRIGGER: close
    steps:
      - name: Checkout trusted base-main cleanup code, never PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/main
          path: control
          persist-credentials: false
      - name: Recheck closed state after acquiring mutation lock
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await require('./control/.github/scripts/preview-context.cjs').guard({ github, context, core });
            } catch { core.setFailed('Locked close context check failed.'); }
      - name: Delete preview and verify post-delete absence
        id: cleanup
        if: steps.gate.outputs.action == 'cleanup'
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'cdd-preview-rg' }}
          PREVIEW_DNS_PREFIX: ${{ vars.PREVIEW_DNS_PREFIX }}
        run: bash control/scripts/cleanup-preview.sh
      - name: Publish cleanup result without hiding reporting failures
        if: always() && steps.gate.outputs.action == 'cleanup'
        uses: actions/github-script@v7
        env:
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.status }}
          CLEANUP_RESULT: ${{ steps.cleanup.outputs.result }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        with:
          script: |
            try {
              await require('./control/.github/scripts/preview-report.cjs').cleanup({ github, context, core });
            } catch { core.setFailed('Close cleanup reporting failed safely.'); }
      - name: Upload declared sanitized cleanup evidence
        if: always() && steps.cleanup.outputs.evidence_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-close-cleanup-${{ needs.resolve.outputs.pr_number }}-${{ github.run_attempt }}
          path: ${{ steps.cleanup.outputs.evidence_path }}
          if-no-files-found: error
      - name: Summarize declared cleanup evidence
        if: always()
        env:
          EVIDENCE_PATH: ${{ steps.cleanup.outputs.evidence_path }}
        run: |
          if [[ -n "$EVIDENCE_PATH" && -f "$EVIDENCE_PATH" ]]; then
            printf '### Sanitized close-cleanup evidence\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE_PATH" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
