name: PR-Close Cleanup

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Delete PR Preview Resources
    runs-on: ubuntu-latest
    steps:
      - name: Check for Azure Credentials
        id: check_creds
        run: |
          if [[ -z "${{ secrets.AZURE_CREDENTIALS }}" ]]; then
            echo "AZURE_CREDENTIALS not set. Skipping cloud cleanup."
            echo "skip_cleanup=true" >> $GITHUB_OUTPUT
          else
            echo "skip_cleanup=false" >> $GITHUB_OUTPUT
          fi

      - name: Identify Closing PR Resources
        if: steps.check_creds.outputs.skip_cleanup == 'false'
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "RESOURCE_NAME=preview-pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=${{ secrets.AZURE_RESOURCE_GROUP || 'cdd-preview-rg' }}" >> $GITHUB_ENV

      - name: Azure Login
        if: steps.check_creds.outputs.skip_cleanup == 'false'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete Azure Container Instance
        if: steps.check_creds.outputs.skip_cleanup == 'false'
        run: |
          echo "Targeting ACI: $RESOURCE_NAME in Resource Group: $RESOURCE_GROUP"
          
          # Delete the container group. "|| true" makes it idempotent (won't fail if already deleted)
          az container delete \
            --name "$RESOURCE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --yes || true
            
          echo "Cleanup complete for PR #$PR_NUMBER!"